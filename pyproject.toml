[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-ids-flower"
version = "1.0.0"
description = "Federated Intrusion Detection System built with Flower and PyTorch, evaluated on CIC-IDS2017 under non-IID (Dirichlet) client partitioning."
license = { text = "Apache-2.0" }
dependencies = [
    "flwr[simulation]>=1.19.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "datasets>=2.19.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ids_project"]

[tool.flwr.app]
publisher = "fralo"

[tool.flwr.app.components]
serverapp = "ids_project.server_app:app"
clientapp = "ids_project.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-evaluate = 1.0
learning-rate = 0.001
fraction-fit = 0.6
local-epochs = 2
batch-size = 8

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 10

[tool.flwr.federations.embedded-federation]
address = "127.0.0.1:9093"
insecure = true
